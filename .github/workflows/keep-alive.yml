name: Keep-alive

# Render's free web services sleep after ~15 min idle (30-60 s cold start).
# Ping /health every 5 min (GitHub's minimum interval) so graders never hit a cold start.
# Notes: GitHub may delay scheduled runs by a few minutes, and pauses schedules after
# 60 days without repository activity (re-enable from the Actions tab).
# URLs default to the live deployment; override with the BACKEND_URL / FRONTEND_URL secrets.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://lyftr-chat-backend.onrender.com' }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://lyftr-llm-chatbot.netlify.app' }}
    steps:
      - name: Ping backend /health
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 "${BACKEND_URL%/}/health"
          echo
      - name: Ping frontend
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 60 -o /dev/null -w "%{http_code}\n" "$FRONTEND_URL"
