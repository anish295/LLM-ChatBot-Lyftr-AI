name: Keep-alive

# Render's free web services sleep after ~15 min idle. Ping /health every 10 min.
# Note: GitHub may delay scheduled runs by several minutes and disables schedules
# after 60 days without repository activity (re-enable from the Actions tab).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend /health
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then echo "BACKEND_URL secret not set - skipping"; exit 0; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --retry-all-errors --max-time 60 "${BACKEND_URL%/}/health"
          echo
      - name: Ping frontend
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          if [ -z "$FRONTEND_URL" ]; then echo "FRONTEND_URL secret not set - skipping"; exit 0; fi
          curl --fail --silent --show-error --retry 3 --max-time 60 -o /dev/null -w "%{http_code}\n" "$FRONTEND_URL"
