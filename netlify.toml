# Netlify config for the frontend (Vercel config lives in frontend/vercel.json).
# The API is proxied same-origin: the browser calls /api/*, Netlify forwards it to the
# backend (dist/_redirects is generated at build time from BACKEND_PROXY_TARGET).
# No CORS involved, and privacy extensions have no third-party request to block.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "/api"
  BACKEND_PROXY_TARGET = "https://lyftr-chat-backend.onrender.com"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
